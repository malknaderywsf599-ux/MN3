<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI محلي</title>
<style>
  :root { --bg:#0f1115; --card:#1a1d24; --me:#2b5cff; --text:#e8eaf0; --muted:#8b91a0; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family: system-ui, sans-serif;
         height:100dvh; display:flex; flex-direction:column; }
  header { padding:10px 14px; background:var(--card); display:flex; justify-content:space-between; align-items:center; font-size:14px; }
  #status { color:var(--muted); font-size:12px; }
  #chat { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:90%; padding:10px 12px; border-radius:12px; white-space:pre-wrap; line-height:1.6; font-size:15px; }
  .user { align-self:flex-start; background:var(--me); }
  .bot { align-self:flex-end; background:var(--card); }
  .tag { display:block; font-size:11px; color:var(--muted); margin-bottom:4px; }
  form { display:flex; gap:8px; padding:10px; background:var(--card); }
  textarea { flex:1; resize:none; height:46px; border-radius:10px; border:0; padding:10px; background:var(--bg); color:var(--text); font-size:15px; font-family:inherit; }
  button { border:0; border-radius:10px; padding:0 18px; background:var(--me); color:#fff; font-size:15px; }
  button:disabled { opacity:.5; }
  #bar { height:3px; background:var(--me); width:0%; transition:width .2s; }
</style>
</head>
<body>
<header><strong>🤖 AI محلي (بدون API)</strong><span id="status">جاهز</span></header>
<div id="bar"></div>
<div id="chat"></div>
<form id="form">
  <textarea id="input" placeholder="اكتب سؤالك..." required></textarea>
  <button id="send">إرسال</button>
</form>
<script type="module" src="app.js"></script>
</body>
</html>
