<!doctype html>
<html lang="ar" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>WebLinux</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/xterm@5.3.0/css/xterm.css">
<link rel="stylesheet" href="style.css">
<script>
// تشخيص: بيعرض أي خطأ على الشاشة
function showErr(t){var m=document.getElementById('bootmsg');if(m){m.textContent='خطأ: '+t;m.style.color='#f88';m.style.direction='ltr'}}
addEventListener('error',function(e){var t=e.target;if(t&&(t.src||t.href)){showErr('فشل تحميل '+(t.src||t.href))}else{showErr(e.message)}},true);
addEventListener('unhandledrejection',function(e){showErr(String(e.reason))});
</script>
</head>
<body>
<div id="boot"><div id="bootmsg">...</div><div id="bar"><i id="barfill"></i></div></div>
<div id="term"></div>
<div id="keys"></div>
<script src="https://cdn.jsdelivr.net/npm/xterm@5.3.0/lib/xterm.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xterm-addon-fit@0.8.0/lib/xterm-addon-fit.js"></script>
<script src="config.js"></script>
<script src="keys.js"></script>
<script src="main.js"></script>
</body>
</html>
